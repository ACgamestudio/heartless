<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Heart Less</title>
<link rel="stylesheet" href="./styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#09050F">
  <script>
    // Registra o service worker: é ele que guarda o jogo e os vídeos no
    // aparelho. Depois da primeira partida, os clipes não passam mais pela
    // rede — e o jogo abre até sem internet.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.info('[SW] ativo, escopo', reg.scope))
          .catch(err => console.warn('[SW] não registrou:', err));
      });
    }
  </script>
</head>
<body>

<!-- ===================== TELA 1: ABERTURA / MENU ===================== -->
<section id="screen-start" class="screen active">
  <div class="poster-bg" style="background-image:url('./assets/img/poster.png')"></div>
  <div class="vignette"></div>
  <div class="start-content">
    <h1 class="logo">HEART LESS <span class="owo">OwO</span></h1>
    
    <button id="btn-start" class="btn-glow">INICIAR</button>
    
  </div>
</section>

<!-- ===================== TELA 2: VÍDEO PRODUTORA ===================== -->
<section id="screen-produtora" class="screen video-screen">
  <video id="video-produtora" playsinline>
    <source src="./assets/videos/produtora.mp4" type="video/mp4">
  </video>
  <div class="video-fallback">
    <p>PRODUTORA</p>
  </div>
  <button class="btn-skip" data-skip="produtora">Pular ▶</button>
</section>

<!-- ===================== TELA 3: VÍDEO INTRO ===================== -->
<section id="screen-intro" class="screen video-screen">
  <video id="video-intro" playsinline>
    <source src="./assets/videos/intro.mp4" type="video/mp4">
  </video>
  <div class="video-fallback">
    <p>HEART LESS OwO</p>
  </div>
  <button class="btn-skip" data-skip="intro">Pular ▶</button>
</section>

<!-- ===================== TELA 3.5: MENU (escolha de modo) ===================== -->
<section id="screen-menu" class="screen">
  <div class="poster-bg" style="background-image:url('./assets/img/poster.png')"></div>
  <div class="vignette"></div>
  <div class="menu-content">
    <h1 class="logo menu-logo">HEART LESS <span class="owo">OwO</span></h1>
    <p class="subtitle menu-subtitle">ESCOLHA O MODO</p>
    <div class="menu-buttons">
      <button id="btn-menu-normal" class="btn-glow">MODO NORMAL</button>
      <button id="btn-menu-arcade" class="btn-ghost">MODO ARCADE</button>
    </div>
  </div>
</section>

<!-- ===================== TELA 4: SELEÇÃO DE PERSONAGEM ===================== -->
<section id="screen-select" class="screen">
  <div class="glow-bg">
    <div class="glow-blob glow-red"></div>
    <div class="glow-blob glow-pink"></div>
    <div class="glow-blob glow-cyan"></div>
  </div>
  <div class="select-mesh"></div>
  <div class="hud-corners"><i></i><i></i><i></i><i></i></div>

  <div class="select-head">
    <h2 class="section-title">ESCOLHA SEU LUTADOR</h2>
    <div class="roster-count"><span id="roster-index">--</span><b> / </b><span id="roster-total">0</span></div>
  </div>

  <div class="select-layout">
    <div class="hero-panel">
      <div class="hero-ring"></div>
      <div class="hero-figure">
        <img id="hero-img" class="empty" alt="" src="./assets/img/poster.png">
      </div>
      <div class="hero-info">
        <span class="hero-code" id="hero-code">aguardando</span>
        <h3 class="hero-name" id="hero-name">SELECIONE</h3>
        <span class="hero-badge padrao" id="hero-badge">— — —</span>
      </div>
    </div>

    <div class="roster-wrap">
      <div id="character-grid" class="character-grid"></div>
      <div class="roster-tools">
        <button id="btn-random" class="btn-hud" type="button">&#8635; SORTEAR</button>
        <span class="roster-hint"><kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> navegar &middot; <kbd>Enter</kbd> confirmar &middot; <kbd>R</kbd> sortear</span>
      </div>
    </div>
  </div>

  <div class="select-bar">
    <div class="select-info">
      <span id="selected-name">Nenhum lutador selecionado</span>
    </div>
    <div class="select-actions">
      <button id="btn-confirm" class="btn-glow" disabled>CONFIRMAR</button>
    </div>
  </div>
</section>

<!-- ===================== TELA 5: JOGO (estilo fighting game) ===================== -->
<section id="screen-game" class="screen">
  <div class="glow-bg">
    <div class="glow-blob glow-red"></div>
    <div class="glow-blob glow-pink"></div>
    <div class="glow-blob glow-cyan"></div>
  </div>
  <div class="arena-lines"></div>

  <p class="game-subtitle">Nocauteie o rival</p>

  <div class="fight-hud">
    <div class="fighter-block">
      <div class="fighter-row">
        <span id="player-name" class="fighter-name">Você</span>
        <span id="player-hp-num" class="hp-num">100</span>
      </div>
      <div id="player-hp-outer" class="hp-bar-outer">
        <div id="player-hp-ghost" class="hp-bar-ghost"></div>
        <div id="player-hp-fill" class="hp-bar-fill hp-fill-player"></div>
      </div>
      <div id="player-meter-outer" class="meter-bar-outer"><div id="player-meter-fill" class="meter-bar-fill"></div></div>
    </div>

    <div class="hud-vs">
      <svg class="vs-bolt" viewBox="0 0 40 100" fill="none">
        <path d="M24 0 L4 55 L18 55 L14 100 L38 40 L22 40 Z" fill="currentColor"/>
      </svg>
      <span>VS</span>
    </div>

    <div class="fighter-block fighter-block-rival">
      <div class="fighter-row">
        <span id="rival-name" class="fighter-name">Rival</span>
        <span id="rival-hp-num" class="hp-num">100</span>
      </div>
      <div id="rival-hp-outer" class="hp-bar-outer">
        <div id="rival-hp-ghost" class="hp-bar-ghost"></div>
        <div id="rival-hp-fill" class="hp-bar-fill hp-fill-rival"></div>
      </div>
      <div id="rival-meter-outer" class="meter-bar-outer"><div id="rival-meter-fill" class="meter-bar-fill"></div></div>
    </div>
  </div>

  <div class="stage-row">
    <div class="portrait-stage stage-player">
      <img id="player-portrait" class="portrait" alt="jogador">
      <span id="player-dmg" class="dmg-popup"></span>
    </div>
    <div id="combo" class="combo"></div>
    <div id="clash" class="clash"></div>
    <div class="portrait-stage stage-rival">
      <img id="rival-portrait" class="portrait" alt="rival">
      <span id="rival-dmg" class="dmg-popup"></span>
    </div>
  </div>

  <div class="result-panel">
    <p id="round-result" class="round-result">Faça sua jogada!</p>
  </div>

  <div class="choices">
    <button class="choice-btn" data-choice="punch">
      <i class="rail"></i><span class="key">1</span>
      <span class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8.5 6h6.2A3.3 3.3 0 0 1 18 9.3v5.4A3.3 3.3 0 0 1 14.7 18H8.5A2.5 2.5 0 0 1 6 15.5v-7A2.5 2.5 0 0 1 8.5 6Z"/>
        <path d="M10.2 6.4v11.2M13.2 6.4v11.2"/>
        <path d="M2.6 9.2h2.2M1.6 12h3.2M2.6 14.8h2.2" opacity=".75"/>
      </svg></span>
      <span class="lbl">Soco</span>
    </button>

    <button class="choice-btn" data-choice="kick">
      <i class="rail"></i><span class="key">2</span>
      <span class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 3.4v6.1l5.1 3.2"/>
        <path d="M12.1 12.7h4.6a2.1 2.1 0 0 1 0 4.2h-3.4"/>
        <path d="M18.4 5.6a8 8 0 0 1 2 5.6M3.4 17.4h5" opacity=".75"/>
      </svg></span>
      <span class="lbl">Chute</span>
    </button>

    <button class="choice-btn" data-choice="block">
      <i class="rail"></i><span class="key">3</span>
      <span class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.6 20 5.8v6.1c0 4.1-3.4 7.5-8 9.5-4.6-2-8-5.4-8-9.5V5.8l8-3.2Z"/>
        <path d="M8.6 12.2 11 14.7l4.6-5.2"/>
      </svg></span>
      <span class="lbl">Bloqueio</span>
    </button>

    <button id="btn-special" class="choice-btn choice-special" data-choice="special" disabled>
      <i class="rail"></i><span class="key">4</span>
      <i class="charge"></i>
      <span class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M12 1.8v3.6M12 18.6v3.6M1.8 12h3.6M18.6 12h3.6M5.1 5.1l2.5 2.5M16.4 16.4l2.5 2.5M18.9 5.1l-2.5 2.5M7.6 16.4l-2.5 2.5"/>
        <circle cx="12" cy="12" r="3.4"/>
        <circle cx="12" cy="12" r="6.6" opacity=".38" stroke-dasharray="3 4"/>
      </svg></span>
      <span class="lbl">Especial</span>
      <span class="chg">0%</span>
    </button>
  </div>

  <button id="btn-menu" class="btn-ghost">&larr; Trocar lutador</button>
</section>

<!-- ===================== OVERLAY: VÍDEO DE ESPECIAL ===================== -->
<div id="special-overlay" class="video-overlay hidden">
  <video id="special-video" playsinline></video>
</div>

<!-- ===================== OVERLAY: FIM DE JOGO ===================== -->
<div id="overlay-end" class="overlay hidden">
  <canvas id="confetti-canvas"></canvas>
  <div class="overlay-content">
    <h2 id="overlay-title">VITÓRIA</h2>
    <p id="overlay-subtitle"></p>
    <div class="overlay-buttons">
      <button id="btn-restart" class="btn-glow">JOGAR NOVAMENTE</button>
    </div>
  </div>
</div>

<!-- ===================== OVERLAY: FINAL DO PERSONAGEM (só após vencer o chefão do arcade) ===================== -->
<!-- Tela cheia de verdade, com som, igual ao overlay do especial. Só é aberto
     pelo endGame() quando o jogador vence a 6ª luta (o chefão) no arcade. -->
<div id="victory-overlay" class="video-overlay hidden">
  <video id="victory-video" playsinline></video>
</div>

<script src="./sound.js"></script>
<script src="./characters.js"></script>
<script src="./elements.js"></script>
<script src="./arcade.js"></script>
<script src="./script.js"></script>
</body>
</html>
